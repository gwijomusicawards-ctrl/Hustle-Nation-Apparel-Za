{% extends "base.html" %}{% block content %}<section class="section"><span class="eyebrow">BEHIND THE BRAND</span><h1>Gallery</h1><p class="muted">Campaigns, drops and moments from Hustle Nation.</p><div class="gallery-grid">{% for p in photos %}<figure><img src="{{ url_for('static',filename='uploads/'+p.image) }}" alt="{{ p.title }}"><figcaption>{{ p.title }}</figcaption></figure>{% else %}<div class="empty-gallery"><b>THE GALLERY IS GETTING READY.</b><p>New photos will appear here when uploaded by the store team.</p></div>{% endfor %}</div></section>{% endblock %}
