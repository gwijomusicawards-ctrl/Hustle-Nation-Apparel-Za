services:
  - type: web
    name: hustle-nation-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    disk:
      name: hustle-nation-data
      mountPath: /opt/render/project/src
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Otsile
      - key: ADMIN_PHONE
        sync: false
      - key: WHATSAPP_NUMBER
        value: "27698881104"
